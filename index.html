  header .meta{margin-top:6px;font-size:12.5px;opacity:.92;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04);}

           display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .toolbar .f{display:flex;flex-direction:column;gap:5px;}
  .toolbar label{font-size:12px;color:var(--sub);}
  select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);min-width:150px;}
  input[type=text]{min-width:200px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border:0;background:#fff;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--sub);}
  .seg button.on{background:var(--brand);color:#fff;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
  th{background:#f8fafc;font-size:12.5px;color:var(--sub);font-weight:600;position:sticky;top:0;}
  tr:hover{background:#fafbff;}
  .num{font-variant-numeric:tabular-nums;font-weight:600;}
  .zero{color:var(--sub);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{background:var(--chip);color:var(--chipink);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;}
  .tier{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;}
  .tier.t1{background:#fee2e2;color:#b91c1c;}
  .tier.t2{background:#fef3c7;color:#b45309;}
  .tier.t3{background:#e0e7ff;color:#3730a3;}
  .expand{cursor:pointer;color:var(--brand);font-size:12.5px;user-select:none;}
  .sup-row td{background:#fbfcff;}
  .sup-row .chips{margin-top:0;}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:18px;}
  .badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:6px;padding:1px 7px;font-size:11.5px;margin-left:6px;}
  .empty{text-align:center;color:var(--sub);padding:30px;}
</style>
</head>

const $ = (s)=>document.querySelector(s);
const meta = DATA.summary;
$("#meta").textContent = `数据区间: ${meta.window} ｜ 生成时间: ${meta.generatedAt} ｜ 来源: 马帮ERP(只读)`;
$("#cards").innerHTML = [
  ["店铺总数", meta.storeCount],
  ["有出单店铺", meta.storesWithOrders],
  ["出单订单数", meta.totalOrders],
  ["出单SKU数", meta.totalSku],

].map(([l,n])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

let view = "store";
const stores = DATA.stores;
const fTier=$("#fTier"), fGroup=$("#fGroup"), fSales=$("#fSales"), fSearch=$("#fSearch");

function uniq(arr){return [...new Set(arr)].sort();}
function fillSelect(sel,vals,allLabel){
  sel.innerHTML = `<option value="">${allLabel}</option>` + vals.map(v=>`<option>${v}</option>`).join("");
}
fillSelect(fTier, uniq(stores.map(s=>s.tier)), "全部分层");
fillSelect(fGroup, uniq(stores.map(s=>s.group)), "全部组别");
fillSelect(fSales, uniq(stores.map(s=>s.sales)), "全部销售");

$("#viewSeg").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  view=e.target.dataset.v;
  [...$("#viewSeg").children].forEach(b=>b.classList.toggle("on",b===e.target));
  render();
});
[fTier,fGroup,fSales].forEach(s=>s.addEventListener("change",render));
fSearch.addEventListener("input",render);
$("#reset").addEventListener("click",()=>{
  fTier.value="";fGroup.value="";fSales.value="";fSearch.value="";render();
});

function tierClass(t){ if(t==="头部")return "t1"; if(t==="腰部")return "t2"; return "t3"; }

function render(){
  const kw=(fSearch.value||"").trim().toLowerCase();
  if(view==="store") renderStore(kw); else renderSupplier(kw);
}

function renderStore(kw){
  const rows = stores.filter(s=>
    (!fTier.value||s.tier===fTier.value) &&
    (!fGroup.value||s.group===fGroup.value) &&
    (!fSales.value||s.sales===fSales.value) &&
    (!kw || s.store.toLowerCase().includes(kw) || s.suppliers.join(" ").toLowerCase().includes(kw))
  );
  if(!rows.length){ $("#result").innerHTML=`<div class="empty">无匹配店铺</div>`; return; }
  let html = `<table><thead><tr>
    <th>店铺名</th><th>分层</th><th>组别</th><th>销售</th>
    <th>出单订单</th><th>出单SKU</th><th>供应商数</th><th>供应商</th></tr></thead><tbody>`;
  rows.forEach((s,i)=>{
    const has = s.orderCount>0;
    html += `<tr>
      <td><b>${s.store}</b>${s.matchedShops.length>1?`<span class="badge">${s.matchedShops.length}店</span>`:""}</td>
      <td><span class="tier ${tierClass(s.tier)}">${s.tier||"-"}</span></td>
      <td>${s.group||"-"}</td>
      <td>${s.sales||"-"}</td>
      <td class="num ${has?"":"zero"}">${s.orderCount}</td>
      <td class="num ${has?"":"zero"}">${s.skuCount}</td>
      <td class="num ${has?"":"zero"}">${s.supplierCount}</td>
      <td>${ has
        ? `<span class="expand" onclick="toggleSup(${i})">展开/收起</span>
           <div class="chips" id="sup${i}" style="display:none">${s.suppliers.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`
        : `<span class="zero">区间内无出单</span>` }</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  if(DATA.unmatched.length){
    html += `<h3 style="margin:26px 0 8px;font-size:15px;">未匹配马帮店铺（订单中存在但不属于本清单）</h3>
      <table><thead><tr><th>马帮店铺名</th><th>出单订单</th><th>出单SKU</th></tr></thead><tbody>`+
      DATA.unmatched.map(u=>`<tr><td>${u.shop}</td><td class="num">${u.orderCount}</td><td class="num">${u.skuCount}</td></tr>`).join("")+
      `</tbody></table>`;
  }
  $("#result").innerHTML = html;
}
function toggleSup(i){ const el=document.getElementById("sup"+i); el.style.display = el.style.display==="none"?"flex":"none"; }

function renderSupplier(kw){
  let entries = Object.entries(DATA.supplierToStores).map(([sup,sts])=>({sup,sts}));
  if(kw) entries = entries.filter(e=> e.sup.toLowerCase().includes(kw) || e.sts.join(" ").toLowerCase().includes(kw));
  entries.sort((a,b)=>b.sts.length-a.sts.length);
  if(!entries.length){ $("#result").innerHTML=`<div class="empty">无匹配供应商</div>`; return; }
  let html = `<table><thead><tr><th>供应商</th><th>服务店铺数</th><th>服务店铺</th></tr></thead><tbody>`;
  entries.forEach(e=>{
    html += `<tr><td><b>${e.sup}</b></td><td class="num">${e.sts.length}</td>
      <td><div class="chips">${e.sts.map(x=>`<span class="chip">${x}</span>`).join("")}</div></td></tr>`;
  });
  html += `</tbody></table>`;
  $("#result").innerHTML = html;
}
render();
