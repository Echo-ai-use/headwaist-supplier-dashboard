<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应商打标系统 · 头腰部客户出单SKU供应商</title>
<style>
  /* ============ 深色科技大屏主题 ============ */
  :root{
    --bg:#050b16; --bg2:#071427;
    --card:linear-gradient(180deg,rgba(12,38,68,.78),rgba(6,20,38,.72));
    --ink:#dff1ff; --sub:#7ea6c8;
    --line:rgba(34,211,238,.20); --line2:rgba(34,211,238,.40);
    --brand:#22d3ee; --brand2:#38bdf8; --brand3:#0ea5e9;
    --accent:#f59e0b;
    --green:#22c55e; --red:#f43f5e;
    --chip:rgba(34,211,238,.10); --chipink:#7dd3fc;
    --glow:0 0 18px rgba(34,211,238,.10);
  }
  *{box-sizing:border-box;}
  html{background:#050b16;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--ink);font-size:14px;position:relative;
       background:
         radial-gradient(1100px 620px at 50% -10%, rgba(14,116,190,.30), transparent 62%),
         radial-gradient(820px 520px at 4% 6%, rgba(34,211,238,.10), transparent 60%),
         radial-gradient(760px 500px at 98% 30%, rgba(56,189,248,.09), transparent 62%),
         #050b16;
       background-attachment:fixed;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
       background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);
       background-size:46px 46px;
       mask-image:radial-gradient(circle at 50% 22%, #000 20%, transparent 78%);
       -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 20%, transparent 78%);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:#061426;}
  ::-webkit-scrollbar-thumb{background:rgba(34,211,238,.28);border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.45);}
  ::selection{background:rgba(34,211,238,.35);}

  header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
       padding:15px 26px;background:linear-gradient(180deg,rgba(9,32,58,.85),rgba(5,14,28,.25));
       border-bottom:1px solid rgba(34,211,238,.26);}
  header::after{content:"";position:absolute;left:6%;right:6%;bottom:-1px;height:1px;
       background:linear-gradient(90deg,transparent,rgba(56,189,248,.95),transparent);
       box-shadow:0 0 14px rgba(34,211,238,.75);}
  header .pgTitle{font-size:17px;font-weight:800;color:#eafaff;letter-spacing:2px;
       text-shadow:0 0 16px rgba(34,211,238,.55);display:flex;align-items:center;gap:10px;}
  header .pgTitle::before{content:"";width:4px;height:18px;border-radius:2px;
       background:linear-gradient(180deg,#22d3ee,#0ea5e9);box-shadow:0 0 12px rgba(34,211,238,.9);}
  header .meta{font-size:12.5px;color:#8fb8d8;opacity:1;letter-spacing:.3px;}
  header .hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header .exp{border-color:rgba(34,211,238,.55);color:#8beaff;background:rgba(9,42,68,.85);white-space:nowrap;}
  header .exp:hover{color:#eafaff;border-color:rgba(34,211,238,.95);box-shadow:0 0 16px rgba(34,211,238,.4);}
  header .exp.done{border-color:rgba(52,211,153,.9);color:#7ff0c4;box-shadow:0 0 16px rgba(52,211,153,.35);}

  .wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px;position:relative;z-index:1;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:16px 18px;box-shadow:var(--glow),inset 0 0 26px rgba(34,211,238,.045);}
  .card::before,.card::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;}
  .card::before{left:-1px;top:-1px;border-left:2px solid var(--brand2);border-top:2px solid var(--brand2);border-radius:9px 0 0 0;
       filter:drop-shadow(0 0 5px rgba(34,211,238,.85));}
  .card::after{right:-1px;bottom:-1px;border-right:2px solid var(--brand2);border-bottom:2px solid var(--brand2);border-radius:0 0 9px 0;
       filter:drop-shadow(0 0 5px rgba(34,211,238,.85));}
  .card .n{font-size:27px;font-weight:800;color:#4fe3ff;font-variant-numeric:tabular-nums;
       text-shadow:0 0 16px rgba(34,211,238,.60);letter-spacing:.5px;}
  .card .l{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:.5px;}

  .toolbar{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px;
       display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;box-shadow:var(--glow);}
  .toolbar .f{display:flex;flex-direction:column;gap:5px;}
  .toolbar label{font-size:12px;color:var(--sub);letter-spacing:.5px;}
  select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;
       background:rgba(4,14,28,.85);color:var(--ink);min-width:150px;font-family:inherit;outline:none;}
  input[type=text]{min-width:200px;}
  select:focus,input[type=text]:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
  select option{background:#0a1e35;color:#dff1ff;}
  ::placeholder{color:#5d84a6;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:rgba(4,14,28,.85);}
  .seg button{border:0;background:transparent;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit;}
  .seg button:hover{color:var(--ink);}
  .seg button.on{background:linear-gradient(135deg,#0891b2,#0ea5e9);color:#f0fdff;font-weight:700;
       box-shadow:0 0 14px rgba(34,211,238,.45) inset;}
  .btn{background:linear-gradient(135deg,#0891b2,#0ea5e9);color:#f0fdff;border:1px solid rgba(34,211,238,.60);
       border-radius:7px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit;
       box-shadow:0 0 14px rgba(34,211,238,.35);}
  .btn:hover{filter:brightness(1.12);}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
       border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--glow);min-width:1160px;}
  #result{overflow-x:auto;padding-bottom:4px;}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid rgba(34,211,238,.12);vertical-align:top;}
  th{background:#08203a;font-size:12.5px;color:#8fc3e0;font-weight:700;position:sticky;top:0;letter-spacing:.6px;z-index:2;
       border-bottom:1px solid rgba(34,211,238,.30);white-space:nowrap;}
  tr:hover td{background:rgba(34,211,238,.055);}
  .num{font-variant-numeric:tabular-nums;font-weight:700;color:#7fdcff;}
  .zero{color:#54789a;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{background:var(--chip);color:var(--chipink);border:1px solid rgba(34,211,238,.22);border-radius:999px;
       padding:3px 10px;font-size:12px;white-space:nowrap;}

  .tier{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:700;border:1px solid transparent;}
  .tier.t1{background:rgba(244,63,94,.14);color:#fb7185;border-color:rgba(244,63,94,.35);}
  .tier.t2{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.35);}
  .tier.t3{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.35);}
  .expand{cursor:pointer;color:var(--brand2);font-size:12.5px;user-select:none;
       text-shadow:0 0 10px rgba(34,211,238,.40);}
  .expand:hover{color:#8beaff;}
  .sup-row td{background:rgba(34,211,238,.045);}
  .sup-row .chips{margin-top:0;}

  .note{background:rgba(245,158,11,.075);border:1px solid rgba(245,158,11,.32);border-left:3px solid var(--accent);
       border-radius:9px;padding:12px 14px;font-size:12.5px;color:#fcd34d;margin-bottom:18px;
       box-shadow:0 0 18px rgba(245,158,11,.10);}
  .note b{color:#fde68a;}
  .badge{display:inline-block;background:rgba(148,163,184,.14);color:#a8c4dc;border:1px solid rgba(148,163,184,.28);
       border-radius:5px;padding:1px 7px;font-size:11.5px;margin-left:6px;}
  .empty{text-align:center;color:var(--sub);padding:30px;}

  .lvl{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:800;border:1px solid transparent;}
  .lvl.A{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.40);box-shadow:0 0 12px rgba(34,197,94,.18);}
  .lvl.B{background:rgba(56,189,248,.15);color:#7dd3fc;border-color:rgba(56,189,248,.40);box-shadow:0 0 12px rgba(56,189,248,.18);}
  .lvl.C{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.40);box-shadow:0 0 12px rgba(245,158,11,.18);}
  .lvl.D{background:rgba(244,63,94,.15);color:#fb7185;border-color:rgba(244,63,94,.40);box-shadow:0 0 12px rgba(244,63,94,.18);}
  .tag2{display:inline-block;background:rgba(6,182,212,.12);color:#67e8f9;border:1px solid rgba(6,182,212,.28);
       border-radius:5px;padding:2px 8px;font-size:11.5px;margin:0 4px 2px 0;}
  .ph b{color:#7b96b0;}

  .mini{border:1px solid var(--line);background:rgba(8,26,46,.85);border-radius:7px;padding:5px 10px;font-size:12.5px;
       cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap;}
  .mini:hover{border-color:var(--line2);color:#8beaff;box-shadow:0 0 12px rgba(34,211,238,.28);}
  .btn2{background:rgba(8,26,46,.85);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12.5px;
       cursor:pointer;color:var(--ink);font-family:inherit;}
  .btn2:hover{border-color:var(--line2);color:#8beaff;box-shadow:0 0 12px rgba(34,211,238,.28);}

  .mask{position:fixed;inset:0;background:rgba(2,8,18,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
       display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{position:relative;background:linear-gradient(180deg,rgba(11,35,62,.98),rgba(6,18,34,.98));
       border:1px solid rgba(34,211,238,.35);border-radius:12px;max-width:600px;width:100%;max-height:88vh;overflow:auto;
       padding:20px 22px;box-shadow:0 0 0 1px rgba(34,211,238,.10),0 20px 60px rgba(0,0,0,.66),0 0 44px rgba(34,211,238,.18);}
  .modal::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:12px 12px 0 0;
       background:linear-gradient(90deg,transparent,rgba(34,211,238,.95),transparent);}
  .modal h3{margin:0 0 14px;font-size:15.5px;word-break:break-all;color:#eafaff;letter-spacing:.4px;}
  .mrow{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;}
  .mrow label{font-size:12px;color:var(--sub);}
  .mrow input[type=text],.mrow select,.mrow textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;
       font-size:13px;font-family:inherit;background:rgba(4,14,28,.85);color:var(--ink);outline:none;resize:vertical;}
  .mrow input[type=text]:focus,.mrow select:focus,.mrow textarea:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chk{display:flex;flex-wrap:wrap;gap:7px;}
  .chk label{display:inline-flex;align-items:center;gap:5px;background:rgba(34,211,238,.075);border:1px solid rgba(34,211,238,.18);
       border-radius:6px;padding:4px 9px;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .chk label:hover{border-color:var(--line2);}
  .chk input{margin:0;accent-color:#22d3ee;}
  .mdel{color:#fb7185;cursor:pointer;font-weight:800;margin-left:3px;}
  .meta2{font-size:12px;color:var(--sub);}
  /* ===== 可点击元素 ===== */
  .ck{cursor:pointer;}
  .ck .l,.ck .kl,.ck .bl{transition:color .15s;}
  .card.ck:hover,.kpi.ck:hover{border-color:var(--line2);box-shadow:0 0 24px rgba(34,211,238,.30);}
  .card.ck:hover .l,.kpi.ck:hover .kl{color:#9fd8f5;}
  .bar.ck{padding:4px 6px;border-radius:6px;}
  .bar.ck:hover{background:rgba(34,211,238,.08);}
  .bar.ck:hover .bl{color:#eafaff;}
  .chip.ck:hover{border-color:var(--line2);color:#eafaff;box-shadow:0 0 12px rgba(34,211,238,.35);}
  .lnk{color:#8beaff;cursor:pointer;border-bottom:1px dashed rgba(34,211,238,.45);}
  .lnk:hover{color:#eafaff;border-bottom-color:#22d3ee;text-shadow:0 0 10px rgba(34,211,238,.6);}
  /* ===== 地区×品类 矩阵 ===== */
  .matrix-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:10px;background:rgba(6,18,34,.45);}
  table.matrix{width:100%;min-width:0;border:0;border-radius:0;box-shadow:none;background:transparent;border-collapse:separate;border-spacing:0;}
  table.matrix th,table.matrix td{padding:6px 9px;font-size:12px;text-align:center;white-space:nowrap;
       border-bottom:1px solid rgba(34,211,238,.10);vertical-align:middle;}
  table.matrix thead th{background:#08203a;color:#8fc3e0;font-weight:700;position:sticky;top:0;z-index:3;
       border-bottom:1px solid rgba(34,211,238,.30);}
  table.matrix th:first-child,table.matrix td:first-child{text-align:left;position:sticky;left:0;z-index:2;
       background:#0a1e35;min-width:132px;}
  table.matrix thead th:first-child{z-index:4;}
  table.matrix tbody tr:hover td{background:rgba(34,211,238,.055);}
  .mx{display:inline-block;min-width:28px;border-radius:5px;padding:2px 7px;font-weight:700;
       font-variant-numeric:tabular-nums;transition:outline .12s;}
  .mx.ck:hover{outline:1px solid rgba(34,211,238,.75);outline-offset:1px;}

  /* ===== 左侧导航 ===== */
  body{display:flex;align-items:flex-start;min-height:100vh;}
  .sidebar{position:sticky;top:0;flex:0 0 252px;width:252px;height:100vh;overflow-y:auto;z-index:3;
       padding:18px 14px 22px;background:linear-gradient(180deg,rgba(8,28,52,.94),rgba(4,12,24,.94));
       border-right:1px solid rgba(34,211,238,.22);box-shadow:2px 0 26px rgba(0,0,0,.35);}
  .main{flex:1;min-width:0;position:relative;z-index:1;}
  .sb-head{display:flex;gap:11px;align-items:center;padding:4px 6px 15px;margin-bottom:14px;
       border-bottom:1px solid rgba(34,211,238,.18);}
  .sb-logo{width:37px;height:37px;flex:0 0 37px;border-radius:9px;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#0891b2,#22d3ee);color:#031018;font-size:19px;font-weight:800;
       box-shadow:0 0 16px rgba(34,211,238,.55);}
  .sb-title{font-size:14.5px;font-weight:800;color:#eafaff;letter-spacing:1px;
       text-shadow:0 0 14px rgba(34,211,238,.5);}
  .sb-sub{font-size:11.5px;color:#7ea6c8;margin-top:3px;line-height:1.4;}
  .sb-label{font-size:10.5px;color:#5d84a6;letter-spacing:2px;padding:0 8px 9px;}
  .tabs{display:flex;flex-direction:column;gap:6px;}
  .tabs button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
       background:transparent;border:1px solid transparent;border-left:3px solid transparent;border-radius:9px;
       padding:11px 12px;cursor:pointer;color:#9dc0da;}
  .tabs button .ico{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
       background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);color:#7dd3fc;font-size:15px;}
  .tabs button .tx{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .tabs button b{font-size:13.5px;font-weight:700;color:#cfe9ff;letter-spacing:.6px;}
  .tabs button em{font-style:normal;font-size:11px;color:#6f96b6;line-height:1.35;}
  .tabs button:hover{background:rgba(34,211,238,.06);border-color:rgba(34,211,238,.18);}
  .tabs button.on{background:linear-gradient(90deg,rgba(14,116,190,.38),rgba(8,40,72,.20));
       border-color:rgba(34,211,238,.45);border-left-color:#22d3ee;
       box-shadow:0 0 18px rgba(34,211,238,.22),inset 0 0 22px rgba(34,211,238,.10);}
  .tabs button.on .ico{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#031018;border-color:transparent;
       box-shadow:0 0 14px rgba(34,211,238,.60);}
  .tabs button.on b{color:#eafaff;text-shadow:0 0 12px rgba(34,211,238,.55);}
  .tabs button.on em{color:#9dc0da;}
  .sb-foot{margin-top:18px;padding:12px;border-radius:9px;background:rgba(8,26,46,.55);
       border:1px solid var(--line);font-size:11.5px;color:#7ea6c8;line-height:1.8;}
  .sb-foot b{color:#7fdcff;}
  .sbf-label{margin:11px 0 7px;font-size:10.5px;color:#5d84a6;letter-spacing:2px;}
  .sbf-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .sbf-chip{cursor:pointer;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);color:#7dd3fc;
       border-radius:6px;padding:3px 8px;font-size:11px;}
  .sbf-chip:hover{border-color:var(--line2);color:#eafaff;box-shadow:0 0 10px rgba(34,211,238,.35);}
  @media(max-width:900px){
    body{flex-direction:column;align-items:stretch;}
    .sidebar{position:static;width:auto;flex:none;height:auto;border-right:0;
         border-bottom:1px solid rgba(34,211,238,.22);}
    .tabs{flex-direction:row;flex-wrap:wrap;}
    .tabs button{width:auto;}
    .tabs button em{display:none;}
  }
  /* ===== 面板 / 图表 ===== */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:980px){.grid2{grid-template-columns:1fr;}}
  .panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
       box-shadow:var(--glow),inset 0 0 26px rgba(34,211,238,.04);}
  .panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;}
  .panel::before{left:-1px;top:-1px;border-left:2px solid var(--brand2);border-top:2px solid var(--brand2);border-radius:9px 0 0 0;
       filter:drop-shadow(0 0 5px rgba(34,211,238,.85));}
  .panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--brand2);border-bottom:2px solid var(--brand2);border-radius:0 0 9px 0;
       filter:drop-shadow(0 0 5px rgba(34,211,238,.85));}
  .panel h3{margin:0 0 15px;font-size:13.5px;color:#bfe9ff;letter-spacing:1.2px;font-weight:700;
       display:flex;align-items:center;gap:9px;}
  .panel h3::before{content:"";width:3px;height:14px;border-radius:2px;
       background:linear-gradient(180deg,#22d3ee,#0ea5e9);box-shadow:0 0 10px rgba(34,211,238,.85);}
  .bars{display:flex;flex-direction:column;gap:9px;}
  .bar{display:grid;grid-template-columns:118px 1fr 54px;align-items:center;gap:10px;font-size:12.5px;}
  .bar .bl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .bt{height:9px;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.14);border-radius:5px;overflow:hidden;}
  .bar .bf{height:100%;border-radius:5px;background:linear-gradient(90deg,#0891b2,#22d3ee);
       box-shadow:0 0 12px rgba(34,211,238,.55);}
  .bar .bv{text-align:right;color:#7fdcff;font-weight:700;font-variant-numeric:tabular-nums;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px;}
  .kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 18px;
       box-shadow:var(--glow);}
  .kpi .kv{font-size:25px;font-weight:800;color:#4fe3ff;text-shadow:0 0 16px rgba(34,211,238,.60);
       font-variant-numeric:tabular-nums;}
  .kpi .kl{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:.5px;}
  .kpi .ks{position:absolute;right:16px;top:16px;font-size:12px;color:#7fdcff;font-weight:700;}
  .gaps{display:flex;flex-direction:column;gap:10px;}
  .gap{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:10px 13px;
       font-size:13px;color:#fcd34d;}
  .gap b{color:#fde68a;font-size:15px;margin:0 3px;}
  .chip.supclick{cursor:pointer;}
  .chip.supclick:hover{border-color:var(--line2);color:#eafaff;box-shadow:0 0 12px rgba(34,211,238,.35);}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-head">

// ---- 首轮回填 + 自愈: 服务端预判的 品类/地区 ----
// 判定「纯自动回填项」: 只含 cats/region/tier 三个键(即从未在弹窗里保存过)。手改过的(8键)永不被覆盖。
const isSeedDerived = m => !!m && Object.keys(m).every(k=>["cats","region","tier"].includes(k));
function applySeed(){
  const s = (DATA.seedMeta && typeof DATA.seedMeta==="object") ? DATA.seedMeta : {};
  let changed=false, n=0;
  for(const k in s){
    const cur = META[k];
    if(!cur || !Object.keys(cur).length || isSeedDerived(cur)){
      META[k] = {cats:s[k].cats||[], region:s[k].region||"", tier:(cur&&cur.tier)||""};
      changed=true; n++;
    }
  }
  // 清理: 早期版本回填过、但新版已判定为非供应商(如平台名/占位)的, 清空其自动回填内容
  for(const k in META){
    if(isSeedDerived(META[k]) && !(k in s)){ META[k]={cats:[],region:"",tier:(META[k]&&META[k].tier)||""}; changed=true; }
  }
  return {changed,n};
}

    return `<div${attr}><div class="bl" title="${escAttr(k)}">${k}</div>
        <div class="bt"><div class="bf" style="width:${(v/max*100).toFixed(1)}%"></div></div>
        <div class="bv">${v}</div></div>`;
  }).join("") + `</div>`;
}

// ================= 地区 × 品类 分析 =================
function renderCatMap(){
  const rep={}, catTotal={};
  let noCat=0;
  for(const [sup,sts] of Object.entries(DATA.supplierToStores)){
    const m=META[sup]||{};
    const reg=(m.region||"").trim()||"未标注地区";
    const r=rep[reg]||(rep[reg]={region:reg,n:0,cats:{},stores:new Set()});
    r.n++;
    const cs=m.cats||[];
    if(!cs.length) noCat++;
    cs.forEach(c=>{ r.cats[c]=(r.cats[c]||0)+1; catTotal[c]=(catTotal[c]||0)+1; });
    (sts||[]).forEach(s=>r.stores.add(s));
  }
  const cats=Object.entries(catTotal).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const rows=Object.values(rep).sort((a,b)=> b.n-a.n || a.region.localeCompare(b.region,"zh"));
  let maxCell=1;
  rows.forEach(r=>cats.forEach(c=>{ if((r.cats[c]||0)>maxCell) maxCell=r.cats[c]; }));

  // ---- 导出数据：地区 × 品类 矩阵（每格=该地区该品类的供应商数）----
  const exRows = [["地区","商家数", ...cats]];
  rows.forEach(r=>exRows.push([r.region, r.n, ...cats.map(c=>r.cats[c]||0)]));
  lastExport = { label:"地区品类矩阵", rows: exRows };

  if(!rows.length){ $("#result").innerHTML=`<div class="empty">暂无数据</div>`; return; }

  // ---- 表A：地区主力品类 ----
  let html = `<div class="panel"><h3>各地区主力品类（按商家数排序）</h3>
    <table><thead><tr><th>地区</th><th>商家数</th><th>主力品类</th><th>占比</th><th>品类构成</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const list=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]);
    const tot=list.reduce((s,x)=>s+x[1],0);
    const main=list[0];
    const share = (main && tot) ? (main[1]/tot*100) : 0;
    const chips=list.slice(0,6).map(([c,n])=>
      `<span class="chip ck" data-act="rcat" data-val="${escAttr(c)}" data-reg="${escAttr(r.region)}" title="查看该地区该品类的供应商">${c} ${n}</span>`).join("");
    html += `<tr>
      <td><b class="lnk" data-act="region" data-val="${escAttr(r.region)}" title="查看该地区全部供应商">${r.region}</b></td>
      <td class="num">${r.n}</td>
      <td>${main?`<span class="lvl B">${main[0]}</span>`:`<span class="zero">未标注</span>`}</td>
      <td><div class="bar" style="grid-template-columns:1fr 48px;"><div class="bt"><div class="bf" style="width:${share.toFixed(1)}%"></div></div><div class="bv">${main?share.toFixed(1)+"%":"-"}</div></div></td>
      <td>${chips||`<span class="zero">-</span>`}</td>
    </tr>`;
  });
  html += `</tbody></table>
    <div class="meta2" style="margin-top:9px;">「主力品类」= 该地区供应商中标注数量最多的品类；「占比」= 主力品类数 ÷ 该地区全部品类标注数。</div></div>`;

  // ---- 表B：地区 × 品类 矩阵 ----
  html += `<div class="panel" style="margin-top:16px;"><h3>地区 × 品类 分布矩阵（数字=供应商数，越亮越多 · 可点）</h3>
    <div class="matrix-wrap"><table class="matrix"><thead><tr><th>地区</th><th>商家</th>`
    + cats.map(c=>`<th title="${escAttr(c)}">${c}</th>`).join("") + `</tr></thead><tbody>`;
  rows.forEach(r=>{
    html += `<tr><td><b class="lnk" data-act="region" data-val="${escAttr(r.region)}">${r.region}</b></td><td class="num">${r.n}</td>`;
    cats.forEach(c=>{
      const v=r.cats[c]||0;
      if(!v){ html += `<td><span class="zero">·</span></td>`; return; }
      const ratio=v/maxCell;
      const alpha=(0.12+0.62*ratio).toFixed(2);
      html += `<td><span class="mx ck" data-act="rcat" data-val="${escAttr(c)}" data-reg="${escAttr(r.region)}"
        style="background:rgba(34,211,238,${alpha});color:${ratio>0.5?"#031018":"#cfe9ff"}" title="${escAttr(r.region)} · ${escAttr(c)}：${v} 家">${v}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;

  // ---- 表C：品类主力地区（反向） ----
  const catRep={};
  rows.forEach(r=>Object.entries(r.cats).forEach(([c,n])=>{
    const o=catRep[c]||(catRep[c]={n:0,regions:{}});
    o.n+=n; o.regions[r.region]=(o.regions[r.region]||0)+n;
  }));
  const catRows=Object.entries(catRep).sort((a,b)=>b[1].n-a[1].n);
  html += `<div class="panel" style="margin-top:16px;"><h3>品类主力地区（反向看：每个品类集中在哪里）</h3>
    <table><thead><tr><th>品类</th><th>商家数</th><th>主力地区</th><th>主要地区（Top 5）</th></tr></thead><tbody>`;
  catRows.forEach(([c,o])=>{
    const regs=Object.entries(o.regions).sort((a,b)=>b[1]-a[1]);
    const top=regs[0];
    const chips=regs.slice(0,5).map(([rg,n])=>
      `<span class="chip ck" data-act="rcat" data-val="${escAttr(c)}" data-reg="${escAttr(rg)}">${rg} ${n}</span>`).join("");
    html += `<tr>
      <td><b>${c}</b></td>
      <td class="num">${o.n}</td>
      <td><span class="lvl A">${top[0]}</span></td>
      <td>${chips}</td></tr>`;
  });
  html += `</tbody></table>
    <div class="meta2" style="margin-top:9px;">点任意地区名 / 品类标签 / 矩阵格子，都会跳到筛选好的供应商清单。</div></div>`;

  $("#result").innerHTML = html;
}

// ================= 地区分布 =================
let lastRegions=[];
function renderRegion(kw){
  const rep={}; let cnt=0;
  for(const [sup, sts] of Object.entries(DATA.supplierToStores)){
    const m = META[sup]||{};
    const reg = (m.region||"").trim() || "未标注地区";
    if(kw && !reg.toLowerCase().includes(kw) && !sup.toLowerCase().includes(kw)) continue;
    if(fCat.value && !(m.cats||[]).includes(fCat.value)) continue;
    if(fLevel.value){
      const t=m.tier||"";
      if(fLevel.value==="__rated__"){ if(!t) continue; }
      else if(fLevel.value==="__unrated__"){ if(t) continue; }
      else if(t!==fLevel.value) continue;
    }
    cnt++;
    const r = rep[reg] || (rep[reg]={region:reg, sups:[], cats:{}, lv:{A:0,B:0,C:0,D:0,"":0}, stores:new Set()});
    r.sups.push(sup);
    (m.cats||[]).forEach(c=>r.cats[c]=(r.cats[c]||0)+1);
    r.lv[m.tier||""]++;
    (sts||[]).forEach(s=>r.stores.add(s));
  }
  const rows = Object.values(rep).sort((a,b)=> b.sups.length-a.sups.length || a.region.localeCompare(b.region,"zh"));
  lastRegions = rows;
  // ---- 导出数据：地区分布表（遵循当前筛选）----
  const exRows = [["地区","商家数","占比","A级","B级","C级","D级","未评级","分布品类","服务店铺数","供应商明细"]];
  rows.forEach(r=>{
    const share = cnt ? (r.sups.length/cnt*100).toFixed(1)+"%" : "-";
    const catsStr = Object.entries(r.cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`${c}(${n})`).join(" / ");
    exRows.push([r.region, r.sups.length, share, r.lv.A, r.lv.B, r.lv.C, r.lv.D, r.lv[""], catsStr, r.stores.size, r.sups.join(" / ")]);
  });
  lastExport = { label:"地区分布", rows: exRows };
  const catsAll = new Set(); rows.forEach(r=>Object.keys(r.cats).forEach(c=>catsAll.add(c)));
  const filt = (fCat.value||fLevel.value||kw);
  let html = `<div class="meta2" style="margin:0 0 10px;">共 <b>${rows.length}</b> 个地区 ｜ 覆盖 <b>${cnt}</b> 家供应商 ｜ 涉及 <b>${catsAll.size}</b> 个品类${filt?` ｜ <span style="color:#7fdcff">已按筛选过滤</span>`:""}</div>`;
  if(!rows.length){ $("#result").innerHTML = html + `<div class="empty">无匹配地区</div>`; return; }
  html += `<table><thead><tr>
    <th>地区</th><th>商家数</th><th>占比</th><th>等级分布</th><th>分布品类（商家数）</th><th>服务店铺</th><th>明细</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const cats = Object.entries(r.cats).sort((a,b)=>b[1]-a[1]);
    const catHtml = cats.length
      ? cats.map(([c,n])=>`<span class="chip ck" data-act="rcat" data-val="${escAttr(c)}" data-reg="${escAttr(r.region)}" title="查看该地区该品类的供应商">${c} <b style="color:#eafaff">${n}</b></span>`).join("")
      : `<span class="zero">未标注</span>`;
    const lvHtml = ["A","B","C","D"].map(t=> r.lv[t] ? `<span class="lvl ${t}">${t} ${r.lv[t]}</span>` : "").join("")
      + (r.lv[""] ? `<span class="zero"> 未评 ${r.lv[""]}</span>` : "");
    const share = cnt ? (r.sups.length/cnt*100) : 0;
    html += `<tr>
      <td><b class="lnk" data-act="region" data-val="${escAttr(r.region)}" title="查看该地区全部供应商">${r.region}</b></td>
      <td class="num">${r.sups.length}</td>
      <td><div class="bar" style="grid-template-columns:1fr 44px;">
          <div class="bt"><div class="bf" style="width:${share.toFixed(1)}%"></div></div>
          <div class="bv">${share.toFixed(1)}%</div></div></td>
      <td>${lvHtml}</td>
      <td>${catHtml}</td>
      <td class="num">${r.stores.size}</td>
      <td><span class="expand" onclick="toggleRegion(${i})">▾ 展开 ${r.sups.length} 家</span>
        <div class="chips" id="rg${i}" style="display:none;max-height:200px;overflow:auto;">
          ${r.sups.map(s=>`<span class="chip supclick" data-tag="${escAttr(s)}">${s}</span>`).join("")}
        </div></td>
    </tr>`;
  });
  html += `</tbody></table><div class="meta2" style="margin-top:9px;">提示：点<b>地区名</b>或<b>品类标签</b>可跳到筛选好的供应商清单；点供应商标签可直接打标。</div>`;
  $("#result").innerHTML = html;
}
function toggleRegion(i){
  const el=document.getElementById("rg"+i); if(!el)return;
  const open = el.style.display==="none";
  el.style.display = open ? "flex" : "none";
  const t=el.previousElementSibling;
  if(t) t.textContent = open ? "▴ 收起" : `▾ 展开 ${lastRegions[i].sups.length} 家`;
}

let lastEntries=[];
function renderSupplier(kw){
  let entries = Object.entries(DATA.supplierToStores).map(([sup,sts])=>({sup,sts}));
  if(kw) entries = entries.filter(e=> e.sup.toLowerCase().includes(kw) || e.sts.join(" ").toLowerCase().includes(kw));
  if(fRegion.value) entries = entries.filter(e=>(((META[e.sup]||{}).region||"").trim()||"未标注地区")===fRegion.value);
  if(fCat.value) entries = entries.filter(e=>((META[e.sup]||{}).cats||[]).includes(fCat.value));
  if(fLevel.value==="__rated__") entries = entries.filter(e=>!!(META[e.sup]||{}).tier);
  else if(fLevel.value==="__unrated__") entries = entries.filter(e=>!(META[e.sup]||{}).tier);
  else if(fLevel.value) entries = entries.filter(e=>((META[e.sup]||{}).tier||"")===fLevel.value);
  entries.sort((a,b)=>
    lvlRank((META[a.sup]||{}).tier)-lvlRank((META[b.sup]||{}).tier) ||
    b.sts.length-a.sts.length || a.sup.localeCompare(b.sup,"zh"));
  lastEntries=entries;
  // ---- 导出数据：供应商打标清单（遵循当前筛选）----
  const exRows = [["供应商","打标等级","品类","地区","联系人","电话","微信","优势标签","备注","服务店铺数","服务店铺"]];
  entries.forEach(e=>{
    const m=META[e.sup]||{};
    exRows.push([e.sup, m.tier?lvlLabel(m.tier):"未评级", (m.cats||[]).join(" / "), m.region||"",
      m.contact||"", m.phone||"", m.wechat||"", (m.tags||[]).join(" / "), m.note||"", e.sts.length, e.sts.join(" / ")]);
  });
  lastExport = { label:"供应商打标", rows: exRows };
  const tagged = entries.filter(e=>isTagged(META[e.sup])).length;
  let html = `<div class="meta2" style="margin:0 0 10px;">共 <b>${entries.length}</b> 家供应商 ｜ 已打标 <b style="color:var(--brand)">${tagged}</b> 家 ｜ 打标数据保存在本机浏览器，可用「导出/导入」备份迁移</div>`;
  if(!entries.length){ $("#result").innerHTML=html+`<div class="empty">无匹配供应商</div>`; return; }
  html += `<table><thead><tr>
    <th>供应商</th><th>打标等级</th><th>品类</th><th>地区</th><th>联系人 / 方式</th><th>优势标签</th>
    <th>服务店铺数</th><th>服务店铺</th><th>操作</th></tr></thead><tbody>`;
  entries.forEach((e,i)=>{
    const m=META[e.sup]||{};
    const cats=(m.cats||[]).map(c=>`<span class="chip">${c}</span>`).join("");
    const tags=(m.tags||[]).map(t=>`<span class="tag2">${t}</span>`).join("");
    const contact=[m.contact,m.phone,m.wechat].filter(Boolean).join(" / ");
    const ph=PLACEHOLDER.has(e.sup);
    html += `<tr${ph?` class="ph"`:""}>
      <td><b>${e.sup}</b>${ph?`<span class="badge">内部占位</span>`:""}</td>
      <td>${m.tier?`<span class="lvl ${m.tier}">${lvlLabel(m.tier)}</span>`:`<span class="zero">未评级</span>`}</td>
      <td>${cats||`<span class="zero">-</span>`}</td>
      <td>${m.region||`<span class="zero">-</span>`}</td>
      <td>${contact||`<span class="zero">-</span>`}</td>
      <td>${tags||`<span class="zero">-</span>`}</td>
      <td class="num">${e.sts.length}</td>
      <td><span class="expand" onclick="toggleShops(${i})">▾ 展开 ${e.sts.length} 家</span>
        <div class="chips" id="sp${i}" style="display:none">${e.sts.map(x=>`<span class="chip">${x}</span>`).join("")}</div></td>
      <td><button class="mini" onclick="editSupplier(${i})">✏️ 打标</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  $("#result").innerHTML = html;
}
function toggleShops(i){
  const el=document.getElementById("sp"+i);
  if(!el)return;
  const open=el.style.display==="none";
  el.style.display=open?"flex":"none";
  const t=el.previousElementSibling;
  if(t)t.textContent = open?`▴ 收起`:`▾ 展开 ${lastEntries[i].sts.length} 家`;
}

// ================= 打标弹窗 =================
let curSup=null;
document.body.insertAdjacentHTML("beforeend",`
<div class="mask" id="mask" style="display:none">
 <div class="modal">
  <h3>✏️ 供应商打标 · <span id="mName"></span></h3>
  <div class="mrow"><label>打标等级（评估供应商能力）</label>
    <select id="mTier">${LV.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
  <div class="mrow"><label>供应商品类（勾选适用品类，可在下方增删）</label>
    <div class="chk" id="mCats"></div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <input type="text" id="mNewCat" placeholder="新增品类，如：硅胶制品…" style="flex:1;min-width:0;">
      <button class="mini" onclick="addCat()">＋ 添加品类</button>
    </div>
    <div class="meta2" style="margin-top:7px;">全部品类（点 × 删除）：<span id="mCatMgr"></span></div></div>
  <div class="mgrid">
    <div class="mrow"><label>地区</label><input type="text" id="mRegion" placeholder="如 广东-东莞"></div>
    <div class="mrow"><label>联系人</label><input type="text" id="mContact" placeholder="姓名"></div>
    <div class="mrow"><label>电话</label><input type="text" id="mPhone" placeholder="手机号"></div>
    <div class="mrow"><label>微信</label><input type="text" id="mWechat" placeholder="微信号"></div>
  </div>
  <div class="mrow"><label>优势标签</label><div class="chk" id="mTags"></div></div>
  <div class="mrow"><label>备注</label><textarea id="mNote" rows="2" placeholder="合作情况、账期、特殊情况…"></textarea></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px;">
    <button class="btn2" onclick="closeModal()">取消</button>
    <button class="btn" onclick="saveSupplier()">保存打标</button>
  </div>
 </div>
</div>`);

function editSupplier(i){ openTag(lastEntries[i].sup); }
function openTag(sup){
  curSup=sup;
  const m=META[sup]||{};
  $("#mName").textContent=curSup;
  $("#mTier").value=m.tier||"";
  $("#mRegion").value=m.region||""; $("#mContact").value=m.contact||"";
  $("#mPhone").value=m.phone||""; $("#mWechat").value=m.wechat||""; $("#mNote").value=m.note||"";
  drawCats(m.cats||[]); drawTags(m.tags||[]);
  $("#mask").style.display="flex";
}
function checkedVals(sel){ return [...document.querySelectorAll(sel+" input:checked")].map(x=>x.value); }
function drawCats(sel){
  $("#mCats").innerHTML=CATS.map(c=>`<label><input type="checkbox" value="${c}" ${sel.includes(c)?"checked":""}>${c}</label>`).join("");
  $("#mCatMgr").innerHTML=CATS.map(c=>`<span class="chip">${c}<span class="mdel" onclick="delCat('${c}')">×</span></span>`).join(" ");
}
function drawTags(sel){
  $("#mTags").innerHTML=TAGS.map(t=>`<label><input type="checkbox" value="${t}" ${sel.includes(t)?"checked":""}>${t}</label>`).join("");
}
function addCat(){
  const v=$("#mNewCat").value.trim();
  if(v && !CATS.includes(v)) CATS.push(v);
  $("#mNewCat").value="";
  drawCats(checkedVals("#mCats")); fillCatFilter(); saveAll();
}
function delCat(c){
  CATS=CATS.filter(x=>x!==c);
  drawCats(checkedVals("#mCats").filter(x=>x!==c)); fillCatFilter(); saveAll();
}
function closeModal(){ $("#mask").style.display="none"; curSup=null; }
function saveSupplier(){
  if(!curSup)return;
  META[curSup]={
    tier:$("#mTier").value,
    cats:checkedVals("#mCats"),
    region:$("#mRegion").value.trim(), contact:$("#mContact").value.trim(),
    phone:$("#mPhone").value.trim(), wechat:$("#mWechat").value.trim(),
    tags:checkedVals("#mTags"), note:$("#mNote").value.trim()
  };
  saveAll(); closeModal(); render();
}
$("#mask").addEventListener("click",e=>{ if(e.target.id==="mask")closeModal(); });
const ACT_LABEL={store:"店铺清单",supplier:"供应商打标",region:"地区分布",home:"首页总览"};
function clearFilters(){
  fTier.value=""; fGroup.value=""; fSales.value="";
  fCat.value=""; fLevel.value=""; fRegion.value=""; fSearch.value="";
}
function handleAct(act,val,reg){
  clearFilters();
  if(act==="go"){ gotoView(val); }
  else if(act==="cat"){ fCat.value=val; gotoView("supplier"); }
  else if(act==="rcat"){ fCat.value=val; fRegion.value=reg||""; gotoView("supplier"); }
  else if(act==="region"){ fRegion.value=val; gotoView("supplier"); }
  else if(act==="level"){ fLevel.value=val; gotoView("supplier"); }
  else if(act==="prov"){ fSearch.value=val; gotoView("region"); }
  else if(act==="tier"){ fTier.value=val; gotoView("store"); }
  else return;
  window.scrollTo({top:0,behavior:"smooth"});
}
$(".wrap").addEventListener("click",e=>{
  const ck=e.target.closest("[data-act]");
  if(ck){ handleAct(ck.dataset.act, ck.dataset.val, ck.dataset.reg); return; }
  const el=e.target.closest("[data-tag]");
  if(el) openTag(el.dataset.tag);
});

// ================= 通用导出（CSV） =================
function csvCell(v){
  const s = (v===null||v===undefined) ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function downloadCSV(name, rows){
  const csv = "\ufeff" + rows.map(r=>r.map(csvCell).join(",")).join("\r\n");   // \ufeff = BOM，保证 Excel 正确识别中文
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportCurrent(){
  if(!lastExport || !lastExport.rows || !lastExport.rows.length){ alert("当前页面暂无可导出的数据"); return; }
  downloadCSV(`供应商打标系统_${lastExport.label}_${todayStr()}.csv`, lastExport.rows);
  const b=$("#expPage");
  if(b){ b.classList.add("done"); const t=b.textContent; b.textContent="✓ 已导出"; setTimeout(()=>{ b.classList.remove("done"); b.textContent=t; }, 1600); }
}
$("#expPage").addEventListener("click", exportCurrent);

// ================= 导出 / 导入（打标数据备份，JSON） =================
$("#expBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({meta:META,categories:CATS,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="supplier-tags-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
});
$("#impBtn").addEventListener("click",()=>$("#impFile").click());
$("#impFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.meta) META={...META,...d.meta};
      if(Array.isArray(d.categories)) CATS=[...new Set([...CATS,...d.categories])];
      saveAll(); fillCatFilter(); fillRegionFilter(); render(); alert("导入成功：打标数据已合并");
    }catch(err){ alert("文件格式错误，请选择导出的 JSON 文件"); }
  };
  r.readAsText(f);
});
// ================= 🔄 重新回填(按 SKU中文名/供应商名 的预判) =================
$("#reseedBtn").addEventListener("click",()=>{
  const r=applySeed();
  if(r.changed){ saveAll(); fillCatFilter(); fillRegionFilter(); render(); alert("已回填/刷新 "+r.n+" 家供应商的品类·地区（不会覆盖你手动维护过的）"); }
  else{ alert("没有需要回填的供应商（都已有品类/地区或已手动维护）"); }
});

updateVis();
render();
</script>
