<style>
  :root{

  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;}
  header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:22px 28px;}
  header h1{margin:0;font-size:20px;font-weight:700;}
  header .meta{margin-top:6px;font-size:12.5px;opacity:.92;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card .n{font-size:26px;font-weight:700;color:var(--brand);}
  .card .l{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;
           display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .toolbar .f{display:flex;flex-direction:column;gap:5px;}
  .toolbar label{font-size:12px;color:var(--sub);}
  select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);min-width:150px;}

  .seg button.on{background:var(--brand);color:#fff;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;}

  .zero{color:var(--sub);}

  .chip{background:var(--chip);color:var(--chipink);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;}

  .tier.t2{background:#fef3c7;color:#b45309;}
  .tier.t3{background:#e0e7ff;color:#3730a3;}

  .sup-row td{background:#fbfcff;}
  .sup-row .chips{margin-top:0;}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:18px;}
  .badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:6px;padding:1px 7px;font-size:11.5px;margin-left:6px;}
  .empty{text-align:center;color:var(--sub);padding:30px;}

  .lvl.B{background:#dbeafe;color:#1d4ed8;}
  .lvl.C{background:#fef3c7;color:#b45309;}
  .lvl.D{background:#fee2e2;color:#b91c1c;}

  .ph b{color:#9ca3af;}

  .mini:hover{border-color:var(--brand);color:var(--brand);}

  .btn2:hover{border-color:var(--brand);color:var(--brand);}

  .modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.18);}

  .chk input{margin:0;}
  .mdel{color:#dc2626;cursor:pointer;font-weight:700;margin-left:3px;}
  .meta2{font-size:12px;color:var(--sub);}
</style>
</head>

// ---- 首轮回填 + 自愈: 服务端预判的 品类/地区 ----
// 判定「纯自动回填项」: 只含 cats/region/tier 三个键(即从未在弹窗里保存过)。手改过的(8键)永不被覆盖。
const isSeedDerived = m => !!m && Object.keys(m).every(k=>["cats","region","tier"].includes(k));
function applySeed(){
  const s = (DATA.seedMeta && typeof DATA.seedMeta==="object") ? DATA.seedMeta : {};
  let changed=false, n=0;
  for(const k in s){
    const cur = META[k];
    if(!cur || !Object.keys(cur).length || isSeedDerived(cur)){
      META[k] = {cats:s[k].cats||[], region:s[k].region||"", tier:(cur&&cur.tier)||""};
      changed=true; n++;
    }
  }
  // 清理: 早期版本回填过、但新版已判定为非供应商(如平台名/占位)的, 清空其自动回填内容
  for(const k in META){
    if(isSeedDerived(META[k]) && !(k in s)){ META[k]={cats:[],region:"",tier:(META[k]&&META[k].tier)||""}; changed=true; }
  }
  return {changed,n};
}
(function(){ if(applySeed().changed) localStorage.setItem(LS_META, JSON.stringify(META)); })();

function renderStore(kw){
  const rows = stores.filter(s=>
    (!fTier.value||s.tier===fTier.value) &&
    (!fGroup.value||s.group===fGroup.value) &&
    (!fSales.value||s.sales===fSales.value) &&
    (!kw || s.store.toLowerCase().includes(kw) || s.suppliers.join(" ").toLowerCase().includes(kw))
  );
  if(!rows.length){ $("#result").innerHTML=`<div class="empty">无匹配店铺</div>`; return; }
  let html = `<table><thead><tr>
    <th>店铺名</th><th>分层</th><th>组别</th><th>销售</th>
    <th>出单订单</th><th>出单SKU</th><th>供应商数</th><th>供应商</th></tr></thead><tbody>`;
  rows.forEach((s,i)=>{
    const has = s.orderCount>0;
    html += `<tr>
      <td><b>${s.store}</b>${s.matchedShops.length>1?`<span class="badge">${s.matchedShops.length}店</span>`:""}</td>

        ? `<span class="expand" onclick="toggleSup(${i})">展开/收起</span>

        : `<span class="zero">区间内无出单</span>` }</td>
    </tr>`;
  });

  if(DATA.unmatched.length){
    html += `<h3 style="margin:26px 0 8px;font-size:15px;">未匹配马帮店铺（订单中存在但不属于本清单）</h3>

      `</tbody></table>`;
  }
  $("#result").innerHTML = html;
}

let lastEntries=[];
function renderSupplier(kw){
  let entries = Object.entries(DATA.supplierToStores).map(([sup,sts])=>({sup,sts}));
  if(kw) entries = entries.filter(e=> e.sup.toLowerCase().includes(kw) || e.sts.join(" ").toLowerCase().includes(kw));
  if(fCat.value) entries = entries.filter(e=>((META[e.sup]||{}).cats||[]).includes(fCat.value));
  if(fLevel.value) entries = entries.filter(e=>((META[e.sup]||{}).tier||"")===fLevel.value);
  entries.sort((a,b)=>
    lvlRank((META[a.sup]||{}).tier)-lvlRank((META[b.sup]||{}).tier) ||
    b.sts.length-a.sts.length || a.sup.localeCompare(b.sup,"zh"));
  lastEntries=entries;
  const tagged = entries.filter(e=>isTagged(META[e.sup])).length;
  let html = `<div class="meta2" style="margin:0 0 10px;">共 <b>${entries.length}</b> 家供应商 ｜ 已打标 <b style="color:var(--brand)">${tagged}</b> 家 ｜ 打标数据保存在本机浏览器，可用「导出/导入」备份迁移</div>`;
  if(!entries.length){ $("#result").innerHTML=html+`<div class="empty">无匹配供应商</div>`; return; }

    <th>供应商</th><th>打标等级</th><th>品类</th><th>地区</th><th>联系人 / 方式</th><th>优势标签</th>

    const m=META[e.sup]||{};

        <div class="chips" id="sp${i}" style="display:none">${e.sts.map(x=>`<span class="chip">${x}</span>`).join("")}</div></td>
      <td><button class="mini" onclick="editSupplier(${i})">✏️ 打标</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  $("#result").innerHTML = html;
}

let curSup=null;
document.body.insertAdjacentHTML("beforeend",`
<div class="mask" id="mask" style="display:none">
 <div class="modal">
  <h3>✏️ 供应商打标 · <span id="mName"></span></h3>
  <div class="mrow"><label>打标等级（评估供应商能力）</label>
    <select id="mTier">${LV.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
  <div class="mrow"><label>供应商品类（勾选适用品类，可在下方增删）</label>
    <div class="chk" id="mCats"></div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <input type="text" id="mNewCat" placeholder="新增品类，如：硅胶制品…" style="flex:1;min-width:0;">
      <button class="mini" onclick="addCat()">＋ 添加品类</button>
    </div>
    <div class="meta2" style="margin-top:7px;">全部品类（点 × 删除）：<span id="mCatMgr"></span></div></div>
  <div class="mgrid">
    <div class="mrow"><label>地区</label><input type="text" id="mRegion" placeholder="如 广东-东莞"></div>
    <div class="mrow"><label>联系人</label><input type="text" id="mContact" placeholder="姓名"></div>
    <div class="mrow"><label>电话</label><input type="text" id="mPhone" placeholder="手机号"></div>
    <div class="mrow"><label>微信</label><input type="text" id="mWechat" placeholder="微信号"></div>
  </div>
  <div class="mrow"><label>优势标签</label><div class="chk" id="mTags"></div></div>
  <div class="mrow"><label>备注</label><textarea id="mNote" rows="2" placeholder="合作情况、账期、特殊情况…"></textarea></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px;">
    <button class="btn2" onclick="closeModal()">取消</button>
    <button class="btn" onclick="saveSupplier()">保存打标</button>
  </div>
 </div>
</div>`);

function editSupplier(i){
  curSup=lastEntries[i].sup;
  const m=META[curSup]||{};
  $("#mName").textContent=curSup;
  $("#mTier").value=m.tier||"";
  $("#mRegion").value=m.region||""; $("#mContact").value=m.contact||"";
  $("#mPhone").value=m.phone||""; $("#mWechat").value=m.wechat||""; $("#mNote").value=m.note||"";
  drawCats(m.cats||[]); drawTags(m.tags||[]);
  $("#mask").style.display="flex";
}
function checkedVals(sel){ return [...document.querySelectorAll(sel+" input:checked")].map(x=>x.value); }
function drawCats(sel){
  $("#mCats").innerHTML=CATS.map(c=>`<label><input type="checkbox" value="${c}" ${sel.includes(c)?"checked":""}>${c}</label>`).join("");
  $("#mCatMgr").innerHTML=CATS.map(c=>`<span class="chip">${c}<span class="mdel" onclick="delCat('${c}')">×</span></span>`).join(" ");
}
function drawTags(sel){
  $("#mTags").innerHTML=TAGS.map(t=>`<label><input type="checkbox" value="${t}" ${sel.includes(t)?"checked":""}>${t}</label>`).join("");
}
function addCat(){
  const v=$("#mNewCat").value.trim();
  if(v && !CATS.includes(v)) CATS.push(v);
  $("#mNewCat").value="";
  drawCats(checkedVals("#mCats")); fillCatFilter(); saveAll();
}
function delCat(c){
  CATS=CATS.filter(x=>x!==c);
  drawCats(checkedVals("#mCats").filter(x=>x!==c)); fillCatFilter(); saveAll();
}
function closeModal(){ $("#mask").style.display="none"; curSup=null; }
function saveSupplier(){
  if(!curSup)return;
  META[curSup]={
    tier:$("#mTier").value,
    cats:checkedVals("#mCats"),
    region:$("#mRegion").value.trim(), contact:$("#mContact").value.trim(),
    phone:$("#mPhone").value.trim(), wechat:$("#mWechat").value.trim(),
    tags:checkedVals("#mTags"), note:$("#mNote").value.trim()
  };
  saveAll(); closeModal(); render();
}
$("#mask").addEventListener("click",e=>{ if(e.target.id==="mask")closeModal(); });

// ================= 导出 / 导入 =================
$("#expBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({meta:META,categories:CATS,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="supplier-tags-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
});
$("#impBtn").addEventListener("click",()=>$("#impFile").click());
$("#impFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.meta) META={...META,...d.meta};
      if(Array.isArray(d.categories)) CATS=[...new Set([...CATS,...d.categories])];
      saveAll(); fillCatFilter(); render(); alert("导入成功：打标数据已合并");
    }catch(err){ alert("文件格式错误，请选择导出的 JSON 文件"); }
  };
  r.readAsText(f);
});
// ================= 🔄 重新回填(按 SKU中文名/供应商名 的预判) =================
$("#reseedBtn").addEventListener("click",()=>{
  const r=applySeed();
  if(r.changed){ saveAll(); fillCatFilter(); render(); alert("已回填/刷新 "+r.n+" 家供应商的品类·地区（不会覆盖你手动维护过的）"); }
  else{ alert("没有需要回填的供应商（都已有品类/地区或已手动维护）"); }
});

updateVis();
render();
</script>
</body>
</html>
